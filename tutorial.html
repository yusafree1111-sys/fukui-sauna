<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>遊び方｜サウナde政策！限界耐久ゲーム</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 1ページに収めるための調整 */
    body { background: var(--bg-sauna); overflow: hidden; }
    #screen-tutorial { position: relative; opacity: 1; pointer-events: all; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 0; }
    .rank-list { list-style: none; padding: 0; }
    .rank-list li { background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
    .rank-list li span:first-child { font-weight: bold; color: var(--orange); }
    .rank-list li span:last-child { color: white; font-size: 0.75rem; }
  </style>
</head>
<body>
<div id="game-container">
  <div id="screen-tutorial" class="screen active">
    <div class="sauna-bg"></div>

    <h2 class="tutorial-title" style="margin-top: 10px; margin-bottom: 5px; font-size: 1.3rem;">🎮 遊び方</h2>

    <div class="tutorial-steps" style="flex: 1; justify-content: center; padding: 0 16px; gap: 12px;">
      
      <!-- まとめられた遊び方 -->
      <div class="tutorial-step" style="padding: 12px; border-radius: 12px; margin-bottom: 0;">
        <div class="step-num" style="width: 36px; height: 36px; font-size: 1.1rem; flex-shrink: 0;">!</div>
        <div class="step-content">
          <h3 style="font-size: 0.9rem; margin-bottom: 4px;">政策を判定して耐えろ！</h3>
          <p style="font-size: 0.75rem; line-height: 1.4;">流れてくる政策を5秒以内に⭕️か❌で素早くタップ！連続正解でコンボ🔥<br>不正解だと温度が急上昇し、100°Cで限界脱出！</p>
        </div>
      </div>
      
      <!-- ランク説明 -->
      <div class="tutorial-step" style="flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; border-radius: 12px;">
        <h3 style="font-size: 0.9rem; font-weight: 700; color: var(--orange-light); text-align: center; margin-bottom: 0;">🏆 ランク条件</h3>
        <ul class="rank-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
          <li><span>🥇 サウナの神</span> <span>4000点以上</span></li>
          <li><span>🥈 ととのい人</span> <span>2000点以上</span></li>
          <li><span>🥉 初心者</span> <span>500点以上</span></li>
          <li><span>💦 見習い</span> <span>500点未満</span></li>
        </ul>
      </div>

    </div>

    <!-- うさぎは必ず表示 -->
    <div class="tutorial-rabbit" style="margin: 5px 0;">
      <img src="PHOTO/こくみんうさぎ_フレッフレッ.png" alt="こくみんうさぎ" style="height: 85px;">
    </div>

    <div style="text-align: center; font-size: 0.7rem; color: rgba(255,255,255,0.7); margin-bottom: 12px; line-height: 1.4;">
      政策の〇、×は製作者による独断と偏見によるものです。
    </div>

    <div class="title-buttons" style="padding: 0 20px 20px;">
      <a href="index.html" class="btn btn-primary" style="text-align: center; text-decoration: none; padding: 12px;">
        🔥 タイトルに戻る
      </a>
    </div>
  </div>
</div>
</body>
</html>
